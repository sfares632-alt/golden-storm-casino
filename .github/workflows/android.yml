name: Build Golden Storm Casino APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare game
        run: |
          mkdir -p www
          unzip -o golden_storm_casino_v4_vip_lobby.zip -d extracted
          cp -R extracted/GoldenStormCasino/. www/

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Golden-Storm-Casino-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
